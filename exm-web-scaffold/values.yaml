info:
  env: dev
  name: &app-name exm-web-scaffold
  namespace: exm-webns-dev
  image: ghcr.io/example/exm-web-scaffold
  tag: sha-xxxxxxx
  imagePullSecrets: dockerconfigjson-github-com
  replicas: 1
  port: 80
  targetPort: 3000
  healthLiveness: /
  healthReadiness: /

resources:
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 512Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cloud.google.com/gke-spot
              operator: In
              values:
                - "true"
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - *app-name
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "cloud.google.com/gke-spot"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

ingress:
  host: web-dev.example.com
  path: /
  certManager: letsencrypt

extraEnv:
  NODE_ENV: dev
